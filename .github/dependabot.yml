# v1.7.43 — Dependabot for the bot package + the Actions workflows themselves.
# Surfaces npm vulns + Action version drift as PRs. We review + merge weekly.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/bot"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Group minor + patch bumps so we get one PR instead of many.
      bot-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
