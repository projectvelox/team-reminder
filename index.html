<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day Reminders</title>
  <link rel="stylesheet" href="styles.css?v=1.2.0" />
  <script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js"></script>
</head>
<body data-theme="default">
  <header class="topbar">
    <div class="brand">
      <span class="bell">&#9200;</span>
      <h1>Day Reminders</h1>
    </div>
    <div class="topbar-actions">
      <button id="groupToggle" class="btn ghost" title="Group reminders by tag" aria-pressed="false">Group by tag</button>
      <button id="openSettings" class="btn ghost" title="Settings">&#9881; Settings</button>
    </div>
  </header>

  <main>
    <p id="errorBanner" class="error-banner" hidden></p>

    <section class="card">
      <form id="addForm" class="add-row" autocomplete="off">
        <input id="title" type="text" placeholder="What do you need to remember? (try #tags inline, e.g. Send report #work)" aria-label="Reminder text" required />
        <input id="time" type="time" title="Optional time" aria-label="Optional time" />
        <button type="submit" class="btn primary">Add</button>
      </form>
      <p class="hint" id="permHint" hidden></p>
      <p class="hint subtle">Tip: click a title or time to edit. Click the star to mark high priority. Type <code>/help</code> in the Day Reminders chat for slash commands.</p>
    </section>

    <div id="reminderRoot"></div>
  </main>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>

      <label class="row">
        <span>End-of-day check-in time</span>
        <input id="setEodTime" type="time" aria-label="End-of-day check-in time" required />
      </label>
      <p class="hint">The bot will send an "Are you done?" card to your chat at this time on workdays.</p>

      <label class="row">
        <span>Remind me this many minutes before a task</span>
        <input id="setLeadMinutes" type="number" min="0" max="240" step="1" aria-label="Lead time in minutes" required />
      </label>

      <label class="row checkbox">
        <input id="setWeekdaysOnly" type="checkbox" aria-label="Weekdays only" />
        <span>Weekdays only (skip Sat/Sun)</span>
      </label>

      <label class="row checkbox">
        <input id="setNotifications" type="checkbox" aria-label="Notifications on" />
        <span>Notifications on</span>
      </label>

      <div class="dialog-actions">
        <button type="button" id="settingsCancel" class="btn ghost">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=1.2.0"></script>
</body>
</html>
